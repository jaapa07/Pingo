# Gera a versão para PC (Windows portátil + Linux AppImage) e publica como Release do GitHub.
# Dispara quando o arquivo plataformas/desktop/VERSAO muda em main (mude o número para publicar uma versão nova)
# ou manualmente em Actions → "Versão para PC" → Run workflow.
name: Versão para PC

on:
  push:
    branches: [main]
    paths: ['plataformas/desktop/VERSAO']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Ler versão
        id: v
        run: echo "versao=$(tr -d '[:space:]' < plataformas/desktop/VERSAO)" >> "$GITHUB_OUTPUT"
      - name: Gerar pacotes (AppImage + .exe portátil)
        run: npm run build && npx electron-builder --config plataformas/desktop/electron-builder.yml --linux AppImage --win portable --x64 -c.extraMetadata.version=${{ steps.v.outputs.versao }}
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-${{ steps.v.outputs.versao }}
          name: Adventures of Pingo — versão para PC
          prerelease: true
          body: |
            Versão para computador, 100% offline.
            - **Windows:** baixe o `.exe` portátil e abra (não precisa instalar). Na 1ª vez o Windows pode avisar "O Windows protegeu o computador": clique em "Mais informações" → "Executar assim mesmo" (o app não é assinado).
            - **Linux:** baixe o `.AppImage`, dê permissão de execução e abra.
            O save fica na pasta do usuário (menu Jogo → Abrir pasta dos saves).
          files: |
            plataformas/desktop/out/*.exe
            plataformas/desktop/out/*.AppImage
