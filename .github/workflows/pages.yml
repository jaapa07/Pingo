# Publica o jogo no GitHub Pages a cada push em main.
# Ativar uma vez no repositório: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Os assets (sprites, zonas, arenas) já estão versionados em public/: o CI não roda os renders.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
        env:
          # o build do jogo não usa o Electron: não baixar o binário no CI
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build (tsc + vite + Service Worker)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
